name: Deploy to GitHub Pages

# actions/deploy-pages 는 codeload 에서 429 로 다운로드가 계속 실패했다.
# 그래서 공식 Pages 액션을 쓰지 않고, 빌드 결과를 gh-pages 브랜치로 직접 푸시한다.
# 사용하는 액션은 checkout / setup-node 둘뿐 — 저장소 Settings > Pages 의
# Source 는 "Deploy from a branch" → gh-pages / (root) 로 둬야 한다.

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write # gh-pages 브랜치에 푸시하기 위해 필요

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish dist to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll                       # Jekyll 처리 방지 (_ 로 시작하는 경로 보호)
          git init -q
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
