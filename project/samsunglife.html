<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimesSquare — AN JIYUN</title>
  </head>
  <body class="detail-page">
    <section class="detail">
      <!-- 뒤로가기 -->
      <a class="detail__back" href="../index.html" aria-label="목록으로 돌아가기">
        <img src="/images/icon/ico_back.svg" alt="목록으로 돌아가기 버튼" />
      </a>

      <div class="detail__stage">
        <header class="detail__title" data-reveal="1">
          <h1 class="detail__name">삼성생명 다이렉트</h1>
          <p class="detail__period">2024.09 ~ 2025.02</p>
        </header>

        <div class="detail__window win win--point" data-reveal="2">
          <a href="https://direct.samsunglife.com/main" target="_blank" rel="noopener">
            <div class="win__bar"></div>
            <div class="win__body">
              <div class="win__screen">
                <img src="/images/detail/samsunglife.png" alt="삼성생명다이렉트 화면" />
              </div>
            </div>
          </a>
        </div>

        <div class="detail__link" data-reveal="3">
          <img class="detail__cursor" src="/images/icon/ico-cursor.svg" alt="" aria-hidden="true" />
          <a
            class="detail__link-btn"
            href="https://direct.samsunglife.com/main"
            target="_blank"
            rel="noopener"
          >
            사이트로 이동
          </a>
        </div>

        <div class="detail__skills win win--blue" data-reveal="4">
          <div class="win__bar"></div>
          <div class="win__body">
            <ul class="detail__tags">
              <li>Vue</li>
              <li>SCSS</li>
              <li>JavaScript</li>
              <li>SCSS</li>
              <li>Figma</li>
            </ul>
          </div>
        </div>

        <div class="detail__tasks" data-reveal="5">
          <h2 class="detail__tasks-label">주요 업무</h2>
          <div class="detail__tasks-panel">
            <ul class="detail__tasks-list">
              <li>
                기존 서비스 재구축 프로젝트에 파견 인력으로 참여, 웹접근성·반응형을 고려한 퍼블리싱
                담당
              </li>
              <li>
                Vue 환경에서 컴포넌트 단위로 마크업을 구성하고 프론트엔드 개발자와의 연동 작업 수행
              </li>
              <li>프로젝트 표준 퍼블리싱 가이드에 따른 마크업 규칙 준수 및 산출물 관리</li>
              <li>
                재구축 진행 중 발생하는 기획 변경사항에 대응해 화면 구조 및 공통 스타일 수정 반영
              </li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="/src/js/detail.js"></script>
  </body>
</html>
