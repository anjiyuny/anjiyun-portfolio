<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimesSquare — AN JIYUN</title>
  </head>
  <body class="detail-page">
    <section class="detail">
      <!-- 뒤로가기 -->
      <a class="detail__back" href="../index.html" aria-label="목록으로 돌아가기">
        <img src="/images/icon/ico_back.svg" alt="목록으로 돌아가기 버튼" />
      </a>

      <div class="detail__stage">
        <header class="detail__title" data-reveal="1">
          <h1 class="detail__name">TimesSquare</h1>
          <p class="detail__period">2024.02 ~ 2024.04</p>
        </header>

        <div class="detail__window win win--point" data-reveal="2">
          <a href="https://www.timessquare.co.kr/web/www" target="_blank" rel="noopener">
            <div class="win__bar"></div>
            <div class="win__body">
              <div class="win__screen">
                <img src="/images/detail/timessquare.png" alt="타임스퀘어 화면" />
              </div>
            </div>
          </a>
        </div>

        <div class="detail__link" data-reveal="3">
          <img class="detail__cursor" src="/images/icon/ico-cursor.svg" alt="" aria-hidden="true" />
          <a
            class="detail__link-btn"
            href="https://www.timessquare.co.kr/web/www"
            target="_blank"
            rel="noopener"
          >
            사이트로 이동
          </a>
        </div>

        <div class="detail__skills win win--blue" data-reveal="4">
          <div class="win__bar"></div>
          <div class="win__body">
            <ul class="detail__tags">
              <li>HTML</li>
              <li>SCSS</li>
              <li>JavaScript</li>
              <li>GSAP</li>
              <li>SCSS</li>
              <li>XD</li>
            </ul>
          </div>
        </div>

        <div class="detail__tasks" data-reveal="5">
          <h2 class="detail__tasks-label">주요 업무</h2>
          <div class="detail__tasks-panel">
            <ul class="detail__tasks-list">
              <li>
                프로젝트 제안 단계부터 참여해 제안용 산출물 작업 수행, 수주 성공 후 본 프로젝트
                퍼블리싱 담당
              </li>
              <li>GSAP을 활용한 동적 인터랙션 및 스크롤 기반 애니메이션 구현</li>
              <li>웹·모바일·앱 각 환경에 맞춘 UI 퍼블리싱 진행</li>
              <li>브랜드 아이덴티티에 부합하는 인터랙션 구현을 위해 디자인 파트와 협의</li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="/src/js/detail.js"></script>
  </body>
</html>
